# What the IDE reads to decide whether to load this plugin, and how to list it in
# Settings > Plugins. It is read without running any of the plugin's code, so it has to agree
# with what the entry point actually registers.
[plugin]
id = "kz.codingOnTheMoon.colorpickerplugin"
name = "ColorPicker Plugin"
version = "1.1.1"
# Must equal the IDE's PLUGIN_API_VERSION, or the plugin is rejected with that reason.
apiVersion = 4
description = "ColorPicker Plugin, A CodeAssist plugin that displays color swatches in your code and XML files, allowing you to edit them using a color picker."
entryPoints = ["kz.codingOnTheMoon.colorpickerplugin.ColorPickerPlugin"]
uiEntryPoints =["kz.codingOnTheMoon.colorpickerplugin.ColorPickerPlugin"]
capabilities = ["ui.action"]
